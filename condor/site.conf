# Edit this file for CNAF. All paths must be absolute; do not use ~ or $HOME.
# The checkout/build/setup must be readable at these SAME paths on workers.
source_dir = /cnaf/cygno-sim/Users/goppedis/SolarNu/CYGNO_30_Sim
build_dir = /cnaf/cygno-sim/Users/goppedis/SolarNu/build/cygno-common
output_parent = /cnaf/cygno-sim/Users/goppedis/SolarNu
log_dir = $(output_parent)/condor-logs
g4_setup = /EDIT/absolute/path/to/cnaf-geant4-activation.sh
python = /EDIT/absolute/path/to/python3

# External configs default to 3600 s: point these to timeout-only copies below.
gamma_config = $(source_dir)/external/config/hall-c-gamma-2026-proxy.json
neutron_config = $(source_dir)/external/config/hall-c-neutron-wulandari-proxy.json
internal_jobs = 1
memory_per_process_mb = 4096
primaries = 1000000
tag = 1M

universe = vanilla
executable = $(source_dir)/condor/run.sh
arguments = $(campaign)
initialdir = $(source_dir)/condor
getenv = False
environment = "CYGNO_SRC='$(source_dir)' CYGNO_BUILD='$(build_dir)' CYGNO_RUNS='$(output_parent)' CYGNO_G4_SETUP='$(g4_setup)' CYGNO_PYTHON='$(python)' CYGNO_GAMMA_CONFIG='$(gamma_config)' CYGNO_NEUTRON_CONFIG='$(neutron_config)' CYGNO_JOBS=$(cpus) CYGNO_PRIMARIES=$(primaries) CYGNO_TAG='$(tag)'"
should_transfer_files = NO
transfer_executable = False
request_cpus = $(cpus)
# MiB: one GiB for the runner plus four GiB per simultaneous Geant4 process.
request_memory = 1024 + $(memory_per_process_mb) * $(cpus)
output = $(log_dir)/$(campaign)-$(tag).$(Cluster).$(Process).out
error = $(log_dir)/$(campaign)-$(tag).$(Cluster).$(Process).err
log = $(log_dir)/$(campaign)-$(tag).$(Cluster).$(Process).log
on_exit_hold = (ExitBySignal =?= True) || (ExitCode =!= 0)
# The runners handle SIGINT and retain interrupted attempts.
kill_sig = SIGINT
hold_kill_sig = SIGINT
remove_kill_sig = SIGINT
job_max_vacate_time = 60
notification = Never

# Add only settings supplied by CNAF here (accounting group, requirements,
# container/OS selection, credentials, wall time/JobFlavour, schedd policy).
# A whole internal campaign needs time for ALL contributions, not just one.
